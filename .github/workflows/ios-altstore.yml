name: iOS IPA for AltStore

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-altstore.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-altstore.yml'

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec ios/project.yml --project ios
      - name: Build for physical iPhone
        run: |
          xcodebuild -project ios/DevMoter.xcodeproj -scheme DevMoter \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned IPA for AltStore signing
        run: |
          mkdir -p build/package/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/DevMoter.app build/package/Payload/
          cd build/package
          zip -r -X ../DevMoter-AltStore.ipa Payload
      - name: Verify physical-device IPA and checksum
        run: |
          set -euo pipefail
          APP=build/package/Payload/DevMoter.app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.devmoter.fast
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist")" = iPhoneOS
          BIN=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          xcrun lipo -verify_arch arm64 "$APP/$BIN"
          unzip -t build/DevMoter-AltStore.ipa
          cd build
          shasum -a 256 DevMoter-AltStore.ipa > DevMoter-AltStore.ipa.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DevMoter-AltStore
          path: |
            build/DevMoter-AltStore.ipa
            build/DevMoter-AltStore.ipa.sha256
          if-no-files-found: error
          retention-days: 14
