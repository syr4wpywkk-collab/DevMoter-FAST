name: Math engine CI

# The Rust math engine lives in math-engine/; other changes do not run these checks.
on:
  push:
    branches: [main]
    paths:
      - math-engine/**
      - .github/workflows/math-engine-ci.yml
  pull_request:
    paths:
      - math-engine/**
      - .github/workflows/math-engine-ci.yml

permissions:
  contents: read

concurrency:
  group: math-engine-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: math-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the toolchain pinned in math-engine/rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
