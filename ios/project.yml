name: DevMoter
options:
  bundleIdPrefix: com.devmoter
  deploymentTarget:
    iOS: '17.0'
targets:
  DevMoter:
    type: application
    platform: iOS
    sources: [DevMoter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.devmoter.fast
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DevMoter
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connect to your private DevMoter server.
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '1'
